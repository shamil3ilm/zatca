# Continuous integration for the Masaar compliance platform.
#
# tests/Feature/Security carries the load here: it sweeps the router for
# unguarded routes and proves tenant scoping holds, so a refactor that opens a
# cross-tenant path fails the build rather than reaching a deployment.
#
# PHP 8.4 is required by the dependency tree (symfony/* and pest/*), not a
# preference. Keep this in step with the "php" constraint in composer.json.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          # sqlite3/pdo_sqlite back the in-memory test database declared in
          # phpunit.xml; bcmath is required for monetary arithmetic.
          extensions: openssl, mbstring, bcmath, dom, xml, curl, zip, fileinfo, tokenizer, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # .env.example ships APP_ENV=production, so both generators would stop for
      # an "are you sure?" confirmation and hang the runner. --force skips it.
      # phpunit.xml overrides APP_ENV to "testing" for the run itself.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan jwt:secret --force

      - name: Run test suite
        run: php artisan test

  # The suite above runs on in-memory SQLite, which is fast but permissive: it
  # does not enforce foreign key types, it accepts a WHERE on a column that does
  # not exist, and it is a console process, where the tenant scope stands down.
  # Each has hidden real defects — submissions declared bigint against UUID keys
  # that MySQL refused outright, an ICV allocation that handed every invoice the
  # same counter, and four separate reads of columns no table has. This job runs
  # the same application against MySQL, over real HTTP and through the suite.
  e2e:
    name: MySQL (suite and end-to-end)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: masaar
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: openssl, mbstring, bcmath, dom, xml, curl, zip, fileinfo, tokenizer, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # This job serves HTTP rather than running PHPUnit, so nothing overrides
      # the environment the way phpunit.xml does — .env is what runs. Its
      # database defaults already name the service above, and session, cache and
      # queue are all database-backed, so no other service is needed.
      #
      # Only APP_ENV is changed: .env.example ships production, and the checks
      # below are written against a normal application environment.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan jwt:secret --force
          sed -i 's/^APP_ENV=.*/APP_ENV=local/' .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run end-to-end checks
        run: php tests/E2e/run.php

      # The same suite the first job runs, against the engine production uses.
      #
      # SQLite accepts a WHERE on a column that does not exist: it matches
      # nothing and returns, so the query looks merely unproductive. MySQL
      # raises SQLSTATE[42S22]. That difference hid four defects at once — a
      # certificate read from a column no table has, a clearance timestamp
      # written to another, a submission filtered on 'status' where the column
      # is 'state', and an expiry read from a third. Each was invisible while
      # the suite was green.
      #
      # The environment is passed inline rather than by editing phpunit.xml, so
      # the default local run stays on SQLite and stays fast.
      - name: Run test suite against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: masaar
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test

  # Some Pint fixer combinations need more than one pass to converge. If
  # `pint --test` still reports files straight after running `pint`, run it
  # again — the second pass settles it.
  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      # Reports known CVEs in the locked dependency tree on every push, so an
      # advisory published against a pinned package surfaces here.
      - name: Audit dependencies
        run: composer audit --locked
